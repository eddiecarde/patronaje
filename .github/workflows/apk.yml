name: APK

# Compila la app Android (APK offline) y la sube como artefacto descargable.
# Se ejecuta a mano (workflow_dispatch) o al etiquetar una versión.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del motor
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar la app web offline (patrones + visores)
        run: |
          python -m patronaje.mobile --output android/app/src/main/assets/www
          echo "Patrones generados:"; ls android/app/src/main/assets/www/patterns | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK (debug + release firmado con clave debug)
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Renombrar APKs
        run: |
          mkdir -p apk_out
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_out/patronaje-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk_out/patronaje.apk || true

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: patronaje-apk
          path: apk_out/*.apk
          if-no-files-found: error
