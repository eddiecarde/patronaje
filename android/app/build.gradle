plugins {
    id 'com.android.application'
}

android {
    namespace 'com.patronaje.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.patronaje.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // APK "release" firmado con la clave debug para poder instalarlo directo
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
